# Builds the site and publishes it to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild once a day so the ISS orbit data stays fresh.
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Resized photos are cached between runs so builds stay fast as the library grows.
      - uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-images-${{ hashFiles('src/content/**') }}
          restore-keys: astro-images-

      - name: Work out the site address
        id: pages
        uses: actions/configure-pages@v5

      # Custom domain: public/CNAME holds it (e.g. bdbphotography.site), so the site is
      # built for https://<domain>/ at the root. Without that file, use GitHub's address
      # (https://<user>.github.io/<repo>/).
      - name: Choose site address
        run: |
          if [ -s public/CNAME ]; then
            echo "SITE_URL=https://$(tr -d '[:space:]' < public/CNAME)" >> "$GITHUB_ENV"
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "SITE_URL=${{ steps.pages.outputs.origin }}" >> "$GITHUB_ENV"
            echo "BASE_PATH=${{ steps.pages.outputs.base_path }}/" >> "$GITHUB_ENV"
          fi

      # The ISS orbit data is downloaded here and served from the site itself, so
      # visitors' browsers never contact a third-party server. If both sources fail,
      # the site still builds and the ISS is simply not shown.
      - name: Download ISS orbit data
        run: |
          if curl -fsS --retry 3 --max-time 20 'https://celestrak.org/NORAD/elements/gp.php?CATNR=25544&FORMAT=TLE' -o public/iss-tle.txt && grep -q '^1 25544' public/iss-tle.txt; then
            echo "ISS data from CelesTrak"
          elif curl -fsS --retry 3 --max-time 20 'https://api.wheretheiss.at/v1/satellites/25544/tles' | jq -r '.line1, .line2' > public/iss-tle.txt && grep -q '^1 25544' public/iss-tle.txt; then
            echo "ISS data from wheretheiss.at"
          else
            echo "::warning::Could not download ISS orbit data; the ISS will be hidden until the next build."
            rm -f public/iss-tle.txt
          fi
          cat public/iss-tle.txt 2>/dev/null || true

      - name: Build
        run: |
          echo "Building for $SITE_URL with base path $BASE_PATH"
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
